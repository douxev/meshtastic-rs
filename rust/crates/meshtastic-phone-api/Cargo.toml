[package]
name = "meshtastic-phone-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic ToRadio/FromRadio state machine — the protocol Meshtastic firmware exposes to phones over BLE/serial/TCP"

[dependencies]
meshtastic-proto = { path = "../meshtastic-proto" }
meshtastic-core = { path = "../meshtastic-core", default-features = false }
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }

[features]
default = ["std"]
## Enable `std::error::Error` impls on error enums.
std = ["meshtastic-core/std"]
